<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Frontend</title>
  <style>
    :root { --bg:#f5f7fb; --panel:#fff; --line:#dbe2ea; --text:#152033; --muted:#667085; --brand:#2563eb; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body {
      margin:0; font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:var(--bg); color:var(--text); display:grid; place-items:center;
    }
    .card {
      width:min(560px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line);
      border-radius:14px; padding:24px; box-shadow:0 12px 32px rgba(15,23,42,.08);
    }
    h1 { margin:0 0 10px; font-size:22px; }
    p { margin:0 0 14px; color:var(--muted); line-height:1.6; }
    a, button {
      display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px;
      border:1px solid var(--brand); background:var(--brand); color:#fff; text-decoration:none;
      padding:10px 14px; font:inherit; cursor:pointer;
    }
    .secondary { background:#fff; color:var(--text); border-color:var(--line); margin-left:10px; }
    code { background:#eef2ff; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Agent Vue Frontend</h1>
    <p>前端已独立出来。请先在 <code>frontend-vue</code> 目录执行 <code>npm install</code> 和 <code>npm run dev</code>。</p>
    <p id="status">默认地址是 <code>http://localhost:5173</code>。</p>
    <div>
      <a href="http://localhost:5173">打开 Vue 前端</a>
      <button class="secondary" type="button" id="copyPath">复制地址</button>
    </div>
  </div>
  <script>
    const target = 'http://localhost:5173';
    const status = document.getElementById('status');
    document.getElementById('copyPath').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(target);
        status.textContent = '已复制：' + target;
      } catch {
        status.textContent = '请手动打开：' + target;
      }
    });
  </script>
</body>
</html>
