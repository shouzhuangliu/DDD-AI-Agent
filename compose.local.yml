name: ai-agent-station-study-local

services:
  mysql:
    image: mysql:8.0.32
    container_name: ai-agent-local-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: "ai-agent-station-study"
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "13306:3306"
    volumes:
      - local_mysql_data:/var/lib/mysql
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/create_tables.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/init_agent_system.sql:/docker-entrypoint-initdb.d/02-agent-system.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/init_data.sql:/docker-entrypoint-initdb.d/03-core-data.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/init_intent_data.sql:/docker-entrypoint-initdb.d/04-intent-data.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/init_react_data.sql:/docker-entrypoint-initdb.d/05-react-data.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260717__enterprise_agent_operations.sql:/docker-entrypoint-initdb.d/06-enterprise-agent-operations.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260718__agent_internal_tool_bindings.sql:/docker-entrypoint-initdb.d/07-agent-internal-tool-bindings.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260728__agent_memory_profile.sql:/docker-entrypoint-initdb.d/08-agent-memory-profile.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260730__subagent_task_state.sql:/docker-entrypoint-initdb.d/09-subagent-task-state.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260801__separate_runtime_signals.sql:/docker-entrypoint-initdb.d/10-separate-runtime-signals.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260802__conversation_analysis_event_idle.sql:/docker-entrypoint-initdb.d/11-conversation-analysis-event-idle.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260803__case_evidence_gate.sql:/docker-entrypoint-initdb.d/12-case-evidence-gate.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260804__repair_display_text_encoding.sql:/docker-entrypoint-initdb.d/13-repair-display-text-encoding.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260805__business_signal_visibility.sql:/docker-entrypoint-initdb.d/14-business-signal-visibility.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260806__business_boundary.sql:/docker-entrypoint-initdb.d/15-business-boundary.sql:ro
      - ./ai-agent-station-study-app/src/main/resources/sql/mysql/migrations/V20260807__restore_cases_archived_for_optional_mcp.sql:/docker-entrypoint-initdb.d/16-restore-optional-mcp-cases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-local-pgvector
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ai-rag-knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "15432:5432"
    volumes:
      - local_pgvector_data:/var/lib/postgresql/data
      - ./ai-agent-station-study-app/src/main/resources/sql/pgvector/init.sql:/docker-entrypoint-initdb.d/01-vector-store.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai-rag-knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional long-term memory service. It is intentionally profile-gated: Mem0
  # needs real OpenAI-compatible LLM/embedding keys before memory writes work.
  mem0:
    image: mem0/mem0-api-server:latest
    container_name: ai-agent-local-mem0
    profiles: ["mem0"]
    restart: unless-stopped
    environment:
      AUTH_DISABLED: "true"
      # LLM: SenseNova OpenAI-compatible chat model.
      OPENAI_API_KEY: ${MEM0_LLM_API_KEY:-${SENSENOVA_API_KEY:-}}
      OPENAI_BASE_URL: ${MEM0_LLM_BASE_URL:-https://token.sensenova.cn/v1}
      OPENAI_MODEL: ${MEM0_LLM_MODEL:-sensenova-6.7-flash-lite}
      # Embedding: SiliconFlow BGE-M3 for Chinese/multilingual memory recall.
      MEM0_EMBEDDING_API_KEY: ${MEM0_EMBEDDING_API_KEY:-${SILICONFLOW_API_KEY:-}}
      MEM0_EMBEDDING_BASE_URL: ${MEM0_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      MEM0_EMBEDDING_MODEL: ${MEM0_EMBEDDING_MODEL:-BAAI/bge-m3}
    ports:
      - "18888:8000"

volumes:
  local_mysql_data:
  local_pgvector_data:
